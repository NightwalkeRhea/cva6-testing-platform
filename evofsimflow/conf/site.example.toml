# Where this machine keeps things. Copy to conf/site.toml (not versioned) and
# change only what differs here; every key is optional.

[paths]
# The checkout this folder belongs to. Left out, it is the parent of this folder.
# repo  = "/path/to/chipyard"
# Which synthesis, by its tag (the build-...-<tag> that 'flow.py --build <tag>'
# uses; CY_BUILD in the environment does the same). Left out, the one build
# directory under vlsi/ is used, and more than one is an error.
# build_tag = "v25"
# Or the build directory itself, relative to the checkout:
# build = "vlsi/build-nangate45-commercial-cva6/chipyard.harness.TestHarness.CVA6Config-ChipTop"
# Everything a run produces. Relative paths sit next to the checkout, never in it.
runs  = "evosbst-runs"

[tools]
# Names on the PATH, or absolute paths. uGP3 (MicroGP++ v3) is built separately.
ugp3    = "ugp3"
vc_fcc  = "vc_fcc"
vc_fcm  = "vc_fcm"
cc      = "riscv64-unknown-elf-gcc"
objdump = "riscv64-unknown-elf-objdump"

[cores]
# What one run may use. Individuals in flight = total / per_ind.
total   = 16
per_ind = 1

[sim]
# Fixed, and part of the inputs-hash: with a seed that changes per run, two
# evaluations of the same program are not comparable.
seed     = 20260806
clock_ns = 1.0

[infra]
# A failure that says nothing about the individual is retried, never scored.
retries       = 2
stall_seconds = 1800
on_stall      = "skip"
